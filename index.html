function spin(){const r=$('#ring');if(!r)return;$('#dial').className=V.dopen?'':'cl';r.style.setProperty('--rot',V.rot+'deg');r.querySelectorAll('.it').forEach((b,i)=>b.classList.toggle('on',DI[i][0]==V.pg));const q=DI.find(z=>z[0]==V.pg);$('#dl').textContent=t(q[2],q[3]);$('#fab').textContent=V.dopen?'✕':q[1]}
function nv(p,k){stop();clearInterval(V.cm);C={on:0,res:0};V.id=null;V.kb=0;if(!k){const a=DI.findIndex(d=>d[0]==V.pg),j=DI.findIndex(d=>d[0]==p);let d=((j-a)%5+5)%5;if(d>2)d-=5;V.rot-=d*72}V.pg=p;if(p=='practice'&&!P.cur)newQ();spin();if(V.dopen)setTimeout(()=>{V.dopen=false;spin()},550);render();scrollTo(0,0)}
const op=id=>{V.id=id;V.ei=0;V.si=0;render();scrollTo(0,0)};
function learnPg(){return`<h1 class="pt">📚 ${t('بخش آموزش روش‌ها','Learning section')}</h1><div class="mut">${t('یک روش را انتخاب کن تا درس مرحله‌به‌مرحله‌اش را ببینی.','Pick a method to see its step-by-step lesson.')}</div><div class="hero"><b>${t('آکادمی محاسبات ذهنی','Mental Math Academy')}</b><small>${t('روش‌ها در سه سطح با هم ترکیب شده‌اند و نام روش هر درس و سؤال بالایش نوشته می‌شود.','Methods are mixed across three levels, and every lesson and question names its method.')}</small><div class="row2"><button class="btn" onclick="mix('mix');nv('practice')">🎲 ${t('تمرین ترکیبی','Mixed practice')}</button><button class="btn g2" onclick="nv('challenge')">⏱️ ${t('چالش ۶۰ ثانیه','60s sprint')}</button></div></div>`+ST.map((s,k)=>{const ids=s[5].split(' '),m=ids.filter(i=>S.ms[i]).length;return`<section class="s${k+1}"><div class="sh"><div class="orb" style="--p:${Math.round(m/ids.length*100)}%"><span>${s[4]}</span></div><div><small>${t('سطح','Level')} ${D(k+1)}</small><b>${T(s)}</b><small>${D(m)}/${D(ids.length)} ${t('تسلط','mastered')} · <a href="#" onclick="mix('mix${k+1}');nv('practice');return false" style="color:var(--sc)">🎲 ${t('تمرین ترکیبی این سطح','mix this level')}</a></small></div></div><div class="cg">${ids.map(id=>{const l=ID(id),v=S.lv[id]||0;return`<button class="mc f${l.c}" onclick="op('${id}')"><span class="ic">${ICO(l)}</span><b>${D(lb(l))}</b><em>${T(FAM[l.c])}</em><i class="pp">${[1,2,3].map(x=>x<=v?'<b>●</b>':'○').join(' ')}</i>${S.ms[id]?'<u>👑</u>':''}</button>`}).join('')}</div></section>`}).join('')}
function lessonPg(){const l=ID(V.id),a=l.ex[V.ei],r=l.f(...a);V.n=r.s.length;V.si=Math.min(V.si,V.n-1);
return`<div class="w2 s${so(l)+1}" style="padding-bottom:130px"><div class="fh"><button class="x" onclick="nv('learn')">✕</button><div class="bar"><i style="width:${(V.si+1)/V.n*100}%"></i></div></div><div class="ban"><span class="bi">${ICO(l)}</span><div><small>📘 ${t('آموزش','LESSON')}</small><h2>${D(T(l.n))}</h2></div></div><div>${chip(l)}</div><h3 class="sec">${t('قاعدهٔ روش','The rule')}</h3><div class="tip">💡 ${D(T(l.r))}</div><h3 class="sec">${t('مثال‌های حل‌شده (مرحله‌به‌مرحله)','Worked examples (step by step)')}</h3><div class="tabs">${l.ex.map((e,j)=>`<button class="pl ${j==V.ei?'on':''}" onclick="stop();V.ei=${j};V.si=0;render()">${t('مثال','Example')} ${D(j+1)}</button>`).join('')}</div><div class="pb">${L2(qt(l,a))}</div>${r.s[0].p?tv(r,V.si):''}${r.s.slice(0,V.si+1).map((s,j)=>`<div class="ln ${j==V.si?'cur':''}"><span class="tt">${D(T(s.t))}</span><div class="mm">${D(stepM(s))}</div></div>`).join('')}${V.si==V.n-1?`<div class="ans">= ${L2(r.v)} ✓</div>`:''}</div><div class="dock"><div class="w2"><button class="btn gl sq" onclick="go(-1)" ${V.si?'':'disabled'}>◀</button><button class="btn gl sq" onclick="play()">↻</button><button class="btn grow" onclick="${V.si<V.n-1?'go(1)':`P.id='${l.id}';P.l=1;P.run=0;P.wrong=0;newQ();nv('practice')`}">${V.si<V.n-1?t('مرحلهٔ بعد','Next step'):t('تمرین این روش ›','Practice it ›')}</button></div></div>`}
const HL=c=>[{r:T(c.l.r)},...c.l.f(...c.a).s];
function pracPg(){const u=S.lv[P.id]||1,c=P.cur,H=HL(c);return`<div class="w2" style="padding-bottom:210px"><div class="fh"><button class="x" onclick="nv('learn')">✕</button><div class="bar"><i style="width:${P.run*33.3}%"></i></div><span class="chip">⚡ ${D(S.sc)}</span></div><select onchange="mix(this.value);render()"><option value="mix">🎲 ${t('ترکیب همهٔ سطح‌ها','Mix of all levels')}</option>${ST.map((s,k)=>`<option value="mix${k+1}" ${P.id=='mix'+(k+1)?'selected':''}>🎲 ${t('ترکیب سطح','Mix of level')} ${D(k+1)}</option>`).join('')}${LS.map(l=>`<option value="${l.id}" ${P.id==l.id?'selected':''}>${D(lb(l))} — ${T(FAM[l.c])}</option>`).join('')}</select><div class="tabs">${[1,2,3].map(x=>`<span class="pl ${x==P.l?'on':''} ${x>u?'lk':''}" onclick="if(${x}<=${u}){P.l=${x};P.run=0;newQ();render()}">${x>u?'🔒 ':''}${t('پلهٔ','Step')} ${D(x)}</span>`).join('')}</div><div class="mut">${t('۳ پاسخ درست پیاپی = پلهٔ بعد؛ دو خطا = یک پله پایین‌تر','3 correct in a row = next step; 2 misses = one step down')}</div><div style="text-align:center;margin-top:10px">${chip(c.l)}</div><div class="q">${L2(c.q)}</div><input id="an" inputmode="numeric" enterkeyhint="done" autocomplete="off" onfocus="V.kb=1" placeholder="?" onkeydown="if(event.key=='Enter')${P.dk=='ok'?'nx()':'chk()'}" ${P.dk=='ok'?'disabled':''}><div class="lkb"><button class="btn gl" onclick="P.h++;render()" ${P.h>=H.length||P.dk=='ok'?'disabled':''}>💡 ${t('راهنما','Hint')} (${D(P.h)}/${D(H.length)})</button><button class="btn gl" onclick="P.h=${H.length};render()" ${P.h>=H.length?'disabled':''}>📖 ${t('همهٔ مراحل','Full solution')}</button><button class="btn gl" onclick="toL('${c.l.id}')">📘 ${t('رفتن به آموزش','Open lesson')}</button></div>${H.slice(0,P.h).map((x,j)=>x.r?`<div class="tip">💡 ${D(x.r)}</div>`:`<div class="ln"><span class="tt">${D(T(x.t))}</span><div class="mm">${D(stepM(x))}</div></div>`).join('')}</div>`+(P.dk?`<div class="dock ${P.dk}"><div class="w2"><div class="grow">${P.fb}</div><button class="btn ${P.dk}" onclick="${P.dk=='ok'?'nx()':"P.fb='';P.dk='';render()"}">${P.dk=='ok'?t('ادامه','Continue'):t('دوباره','Retry')}</button></div></div>`:`<div class="dock"><div class="w2"><button class="btn grow" onclick="chk()">${t('بررسی','Check')}</button></div></div>`)}
function chPg(){if(C.res)return`<div class="w2"><div class="fh"><button class="x" onclick="nv('learn')">✕</button></div><div class="card ctr"><div class="big">🏁</div><h2>${t('پایان چالش','Sprint over')}</h2><div class="pb">${L2(C.sc)}</div><div class="mut">${t('بهترین رکورد','Best')}: ${D(S.cb)}</div><div class="ctl"><button class="btn" onclick="cStart()">${t('دوباره','Again')}</button></div></div></div>`;
if(!C.on)return`<div class="w2"><div class="fh"><button class="x" onclick="nv('learn')">✕</button></div><div class="card ctr"><div class="big">⏱️</div><h2>${t('چالش ۶۰ ثانیه‌ای','60-second sprint')}</h2><p>${t('تا می‌توانی سؤال ترکیبی حل کن؛ با هر ۴ پاسخ درست سؤال‌ها سخت‌تر می‌شوند.','Solve as many mixed questions as you can; every 4 correct makes them harder.')}</p><div class="mut">${t('بهترین رکورد','Best')}: ${D(S.cb)}</div><br><button class="btn g2" onclick="cStart()">${t('شروع!','Go!')}</button></div></div>`;
const c=C.q;return`<div class="w2"><div class="fh"><button class="x" onclick="nv('learn')">✕</button><div class="bar"><i id="tb" style="width:${C.t/60*100}%"></i></div><span class="chip" id="tm">${D(C.t)}</span></div><div style="text-align:center">${chip(c.l)}</div><div class="q">${L2(c.q)}</div><input id="an" inputmode="numeric" enterkeyhint="done" autocomplete="off" onfocus="V.kb=1" placeholder="?" onkeydown="if(event.key=='Enter')cA()"><div class="ctl"><button class="btn" onclick="cA()">${t('ثبت','Submit')}</button></div><div class="ctr ${C.bad?'c':'ans'}">${C.bad?t('✗ نشد؛ بعدی!','✗ Missed — next!'):''} ${t('امتیاز','Score')}: ${D(C.sc)}</div>${C.bad&&C.lw?`<div class="card"><b>${t('پاسخ درست','Correct answer')}: ${L2(C.lw.q+' = '+C.lw.v)}</b><div class="mut">${chip(C.lw.l)}</div>${C.lw.l.f(...C.lw.a).s.map(x=>`<div class="ln"><div class="mm">${D(stepM(x))}</div></div>`).join('')}<div class="ctl"><button class="btn gl" onclick="toL('${C.lw.l.id}')">📘 ${t('آموزش این روش (چالش تمام می‌شود)','Open lesson (ends sprint)')}</button></div></div>`:''}</div>`}
function cStart(){clearInterval(V.cm);C={on:1,res:0,t:60,sc:0,tier:1,bad:0};cq();V.cm=setInterval(()=>{C.t--;if(C.t<=0){clearInterval(V.cm);C.on=0;C.res=1;S.cb=Math.max(S.cb||0,C.sc);S.sc+=C.sc*5;sv();render()}else{const e=$('#tm');if(e){e.textContent=D(C.t);$('#tb').style.width=C.t/60*100+'%'}}},1000);render()}
function cq(){const l=LS[R(0,LS.length-1)],a=l.g(C.tier);C.q={l,a,q:qt(l,a),v:l.f(...a).v}}
function cA(){const i=$('#an');if(!i||!i.value.trim())return;if(pn(i.value)===C.q.v){C.sc++;C.bad=0;C.lw=0;if(C.sc%4==0&&C.tier<3)C.tier++}else{C.bad=1;C.lw=C.q}cq();render()}
function mePg(){const m=Object.keys(S.ms).length;return`<div class="w2"><h2 style="margin-top:16px">${t('پیشرفت من','My progress')}</h2><div class="tiles"><div class="tile">⚡<b>${D(S.sc)}</b>${t('امتیاز','XP')}</div><div class="tile">✅<b>${D(S.ok)}</b>${t('پاسخ درست','Correct')}</div><div class="tile">🔥<b>${D(S.best)}</b>${t('بهترین پیاپی','Best streak')}</div><div class="tile">⏱️<b>${D(S.cb)}</b>${t('رکورد چالش','Sprint best')}</div></div>`+ST.map((s,k)=>`<div class="card s${k+1}"><b style="color:var(--sc)">${s[4]} ${t('سطح','Level')} ${D(k+1)} · ${T(s)}</b>${s[5].split(' ').map(i=>{const l=ID(i);return`<div class="li"><span>${S.ms[i]?'👑':'▫️'} ${D(lb(l))} <span class="mut f${l.c}" style="color:var(--fc)">${T(FAM[l.c])}</span></span><span class="mut">${t('پلهٔ','Step')} ${D(S.lv[i]||0)}/3</span></div>`}).join('')}</div>`).join('')+`</div>`}
function setPg(){const sg=(k,o)=>`<div class="seg">${o.map(x=>`<button class="btn ${S[k]==x[0]?'on':''}" onclick="S.${k}='${x[0]}';sv();render()">${x[1]}</button>`).join('')}</div>`;return`<div class="w2"><h2 style="margin-top:16px">${t('تنظیمات','Settings')}</h2><div class="card"><b>${t('زبان رابط','Interface language')}</b>${sg('ui',[['fa','فارسی'],['en','English']])}</div><div class="card"><b>${t('نوع اعداد','Digits')}</b>${sg('dg',[['fa','۱۲۳ فارسی'],['en','123 English']])}<div class="mut">${t('این دو تنظیم مستقل‌اند.','The two settings are independent.')}</div></div><div class="card"><b>${t('تم و رنگ برنامه','Theme & colours')}</b><div class="sw">${THM.map(x=>`<button class="${(S.th||'galaxy')==x[0]?'on':''}" style="background:linear-gradient(135deg,${x[3]},${x[4]})" onclick="S.th='${x[0]}';sv();render()">${t(x[1],x[2])}</button>`).join('')}</div></div><div class="card"><button class="btn no wide" onclick="if(confirm(t('همهٔ پیشرفت پاک شود؟','Erase all progress?'))){S.sc=S.ok=S.st=S.best=S.cb=0;S.lv={};S.ms={};sv();render()}">${t('بازنشانی پیشرفت','Reset progress')}</button></div></div>`}
function render(){document.documentElement.dir=S.ui=='fa'?'rtl':'ltr';document.documentElement.lang=S.ui;document.documentElement.dataset.th=S.th||'galaxy';if(!P.cur)newQ();const full=V.pg=='practice'||V.pg=='challenge'||(V.pg=='learn'&&V.id);document.body.classList.toggle('fs',full);const pg=V.pg=='practice'?pracPg():V.pg=='challenge'?chPg():V.pg=='learn'?(V.id?lessonPg():learnPg()):V.pg=='me'?mePg():setPg();$('#app').innerHTML=full?pg:topbar()+`<main class="w2" style="padding-bottom:190px">${pg}</main>`;if(DL!=S.ui){DL=S.ui;buildDial()}const i=$('#an');if(i&&V.kb&&V.pg=='challenge')i.focus()}
function stop(){clearInterval(V.tm)}function go(d){stop();V.si=Math.max(0,Math.min(V.n-1,V.si+d));render()}
function play(){stop();V.si=0;render();V.tm=setInterval(()=>{if(V.si>=V.n-1)return stop();V.si++;render()},1500)}
function mix(id){P.id=id;P.l=1;P.run=0;P.wrong=0;newQ()}
function newQ(){const pool=P.id=='mix'?LS:/^mix\d$/.test(P.id)?ST[+P.id[3]-1][5].split(' ').map(ID):[ID(P.id)],l=pool[R(0,pool.length-1)],a=l.g(P.l);P.cur={l,a,q:qt(l,a),v:l.f(...a).v};P.fb='';P.dk='';P.h=0}
function nx(){newQ();render()}
function chk(){const i=$('#an'),raw=i.value.trim();if(!raw||P.dk=='ok')return;const c=P.cur,n=HL(c).length;
if(pn(raw)===c.v){const g=Math.max(2,10*P.l-3*P.h);S.sc+=g;S.ok++;S.st++;S.best=Math.max(S.best,S.st);P.wrong=0;P.run++;let m='';
if(P.run>=3){P.run=0;if(P.l<3){P.l++;m=t('🔓 پلهٔ بعد باز شد!','🔓 Next step unlocked!')}else{S.ms[c.l.id]=1;m=t('👑 تسلط کامل!','👑 Mastered!')}}
S.lv[c.l.id]=Math.max(S.lv[c.l.id]||0,P.l);S.lv[P.id]=Math.max(S.lv[P.id]||0,P.l);
P.fb=`<h3>${t('🎉 آفرین! +','🎉 Great! +')}${D(g)}</h3><div class="sub">${m}${P.h?t(' (هر راهنما ۳ امتیاز کم می‌کند)',' (each hint costs 3 XP)'):''}</div>`+c.l.f(...c.a).s.map(s=>`<div class="ln"><div class="mm">${D(stepM(s))}</div></div>`).join('');P.dk='ok'}
else{S.st=0;P.run=0;P.wrong++;P.h=Math.min(P.h+1,n);P.dk='no';P.fb=`<h3>${t('🤔 هنوز نه','🤔 Not yet')}</h3><div class="sub">${t('یک راهنما باز شد. هنوز نمی‌دانی؟ «همهٔ مراحل» را بزن یا ','A hint opened. Still stuck? Tap “Full solution” or ')}<a href="#" style="color:inherit;text-decoration:underline" onclick="toL('${c.l.id}');return false">${t('آموزش این روش','open the lesson')}</a></div>`;
if(P.wrong>=2&&P.l>1){P.l--;P.wrong=0;newQ();P.dk='no';P.fb=`<h3>${t('🤔 هنوز نه','🤔 Not yet')}</h3><div class="sub">${t('یک پله پایین آمدیم؛ سؤال تازه بگیر.','Stepped down — here is a fresh question.')}</div>`}}
sv();render()}
render();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
