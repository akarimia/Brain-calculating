name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Download fonts (packed inside the APK for offline use)
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fL --retry 3 "https://cdn.jsdelivr.net/npm/vazirmatn@33/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2" -o app/src/main/assets/fonts/Vazirmatn.woff2 || echo "Vazirmatn download failed"
          curl -fL --retry 3 "https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito@5/files/nunito-latin-wght-normal.woff2" -o app/src/main/assets/fonts/Nunito.woff2 || echo "Nunito download failed"
          ls -l app/src/main/assets/fonts
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RiaziBaz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
